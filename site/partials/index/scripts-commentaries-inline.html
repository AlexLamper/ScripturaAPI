<script>
    (function () {
        function esc(v) {
            return String(v)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        var langLabels = { nl: 'Nederlands', en: 'English', de: 'Deutsch', fr: 'Français' };
        function langLabel(code) { return langLabels[code] || code || '-'; }

        function renderCommentaries(list) {
            var loadingEl = document.getElementById('commentariesLoading');
            var errorEl   = document.getElementById('commentariesError');
            var gridEl    = document.getElementById('commentariesGrid');
            if (!loadingEl || !errorEl || !gridEl) return;
            loadingEl.classList.add('hidden');
            errorEl.classList.add('hidden');

            var html = '';
            for (var i = 0; i < list.length; i++) {
                var item        = list[i] || {};
                var key         = esc(item.key || '-');
                var name        = esc(item.name || item.key || '-');
                var lang        = esc(langLabel(item.lang));
                var books       = esc(item.book_count != null ? item.book_count + ' boeken' : '-');
                var description = esc(item.description || 'Geen beschrijving beschikbaar.');
                var endpoint    = esc('/api/commentary?source=' + (item.key || '') + '&book=Genesis&chapter=1');

                html += ''
                    + '<article style="animation-delay:' + (i * 40) + 'ms" class="versions-card group flex min-w-0 flex-col rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition-shadow duration-200 hover:shadow-md">'

                    + '<div class="mb-4 flex min-w-0 items-start justify-between gap-4">'
                    +   '<h3 class="min-w-0 break-words text-sm font-semibold leading-snug text-slate-900">' + name + '</h3>'
                    +   '<code class="shrink-0 rounded-lg border border-blue-100 bg-blue-50 px-2.5 py-1 text-xs font-semibold tracking-wide text-blue-600">' + key + '</code>'
                    + '</div>'

                    + '<div class="mb-4 flex flex-wrap gap-2">'
                    +   '<span class="versions-pill"><span class="versions-pill-label">Taal</span><span class="versions-pill-value">' + lang + '</span></span>'
                    +   '<span class="versions-pill"><span class="versions-pill-label">Boeken</span><span class="versions-pill-value">' + books + '</span></span>'
                    + '</div>'

                    + '<p class="mb-5 flex-grow text-sm leading-relaxed text-slate-600">' + description + '</p>'

                    + '<div class="mt-auto rounded-xl border border-slate-100 bg-slate-50 px-3 py-2.5">'
                    +   '<p class="mb-1 text-[10px] font-medium uppercase tracking-widest text-slate-600">Voorbeeld endpoint</p>'
                    +   '<code class="block break-all font-mono text-xs text-slate-700">' + endpoint + '</code>'
                    + '</div>'

                    + '</article>';
            }

            gridEl.innerHTML = html;
        }

        function showCommentariesError(msg) {
            var loadingEl = document.getElementById('commentariesLoading');
            var errorEl   = document.getElementById('commentariesError');
            if (loadingEl) loadingEl.classList.add('hidden');
            if (errorEl) {
                errorEl.classList.remove('hidden');
                errorEl.innerHTML = '<svg class="h-4 w-4 shrink-0 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>'
                    + '<span>' + (msg || 'Kon beschikbare commentaren momenteel niet laden.') + '</span>';
            }
        }

        function loadCommentaries() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/commentaries', true);
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;
                if (xhr.status < 200 || xhr.status >= 300) {
                    showCommentariesError('Kon beschikbare commentaren momenteel niet laden.');
                    return;
                }
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (!Array.isArray(data)) throw new Error('Invalid payload');
                    renderCommentaries(data);
                } catch (e) {
                    showCommentariesError('Kon beschikbare commentaren momenteel niet laden.');
                }
            };
            xhr.onerror = function () {
                showCommentariesError('Kon beschikbare commentaren momenteel niet laden.');
            };
            xhr.send();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadCommentaries);
        } else {
            loadCommentaries();
        }
    })();
    </script>
